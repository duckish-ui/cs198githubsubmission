<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencil Sharpener Blog</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" type="text/javascript"></script>
  </head>
  <body>
    <div id="sidebar">
      <button id="sidebar-button">›</button>
      <h2>Navigation</h2>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Reviews</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </div>

    <div id="content">
      <h1>The Ultimate Pencil Sharpener Review</h1>
      
      <section id="todo-section">
        <h2>Pencil Sharpener TODOs</h2>
        <input type="text" id="task-name" placeholder="Enter a task..." />
        <button id="add-todo">Add Task</button>
        <ul id="todo-list"></ul>
      </section>

      <section id="greeter-section">
        <h2>User Greeter</h2>
        <input type="text" id="first-name" placeholder="First Name" />
        <input type="text" id="last-name" placeholder="Last Name" />
        <p id="message">Hello !</p>
      </section>
    </div>
  </body>
</html>
